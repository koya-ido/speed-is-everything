<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGreenA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00FF66" />
      <stop offset="100%" stop-color="#00C853" />
    </linearGradient>
    <filter id="glowA" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 背景パネル -->
  <rect width="512" height="512" rx="108" fill="#090a0f" />
  
  <!-- 外周サークル＆トップノッカー -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1f2937" stroke-width="12" />
  <path d="M 256 66 A 190 190 0 0 1 446 256" fill="none" stroke="url(#cyberGreenA)" stroke-width="14" stroke-linecap="round" filter="url(#glowA)" />
  <rect x="246" y="32" width="20" height="26" rx="4" fill="url(#cyberGreenA)" />

  <!-- 目盛り -->
  <line x1="256" y1="96" x2="256" y2="116" stroke="#00FF66" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="396" x2="256" y2="416" stroke="#374151" stroke-width="6" stroke-linecap="round" />
  <line x1="96" y1="256" x2="116" y2="256" stroke="#374151" stroke-width="6" stroke-linecap="round" />
  <line x1="396" y1="256" x2="416" y2="256" stroke="#00FF66" stroke-width="6" stroke-linecap="round" />

  <!-- 中央: 鋭利なサンダーボルト -->
  <polygon points="280,140 170,270 250,270 230,372 342,242 262,242" fill="url(#cyberGreenA)" filter="url(#glowA)" />
</svg>
